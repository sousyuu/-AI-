<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>陳相州老師的日語教學AI平台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="教學上所使用的AI應用程式" />
  <style>
    :root {
      --bg: #0f172a;
      --bg-alt: #020617;
      --card-bg: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-subtle: #1f2937;
      --tag-bg: rgba(15, 118, 110, 0.2);
      --tag-text: #a5f3fc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top left, #1e293b 0, #020617 45%, #000 100%);
      color: var(--text-main);
      line-height: 1.6;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Layout */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: linear-gradient(to bottom, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.7), transparent);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }
    .navbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #e0f2fe, #38bdf8 40%, #0f172a 100%);
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.4), 0 0 20px rgba(56, 189, 248, 0.8);
    }
    .brand-text-main {
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .brand-text-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .nav-links {
      display: flex;
      gap: 1rem;
      font-size: 0.9rem;
    }
    .nav-links a {
      padding: 0.35rem 0.6rem;
      border-radius: 999px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .nav-links a:hover {
      background: rgba(15, 23, 42, 0.85);
      color: #e5e7eb;
    }

    /* Hero */
    .hero {
      padding: 3.5rem 0 2rem;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.8fr);
      gap: 2rem;
      align-items: center;
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent);
      font-size: 0.75rem;
      margin-bottom: 1rem;
    }
